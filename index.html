<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiliPartner | Nykyaikaista ja täysin digitaalista kirjanpitoa Suomessa</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0F172A;
            --primary-light: #1E293B;
            --accent: #0D9488;
            --accent-hover: #0F766E;
            --accent-light: #CCFBF1;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --bg-light: #F8FAFC;
            --bg-white: #FFFFFF;
            --border-color: #E2E8F0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-white);
            line-height: 1.6;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header / Navbar */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--bg-light);
            color: var(--primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #E2E8F0;
        }

        /* Hero Section */
        .hero {
            padding: 100px 0 80px 0;
            background: linear-gradient(180deg, var(--bg-light) 0%, var(--bg-white) 100%);
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--accent-light);
            color: var(--accent-hover);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: 3.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
            line-height: 1.2;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 36px auto;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        /* Features Section */
        .features {
            padding: 90px 0;
            background-color: var(--bg-white);
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header h2 {
            font-size: 2.25rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .feature-icon {
            width: 56px;
            height: 56px;
            background-color: var(--accent-light);
            color: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .feature-card h3 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .feature-card p {
            color: var(--text-muted);
        }

        /* Services Section */
        .services {
            padding: 90px 0;
            background-color: var(--bg-light);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .service-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }

        .service-card i {
            color: var(--accent);
            font-size: 2rem;
            margin-bottom: 16px;
            display: block;
        }

        .service-card h3 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Software Banner */
        .software-banner {
            background-color: var(--primary);
            color: white;
            padding: 60px 0;
            text-align: center;
        }

        .software-content h2 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .software-content p {
            color: #94A3B8;
            max-width: 650px;
            margin: 0 auto;
            font-size: 1.1rem;
        }

        /* Contact Section (Karsittu ja keskitetty versio) */
        .contact {
            padding: 90px 0;
            background-color: var(--bg-white);
            text-align: center;
        }

        .contact-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-content h2 {
            font-size: 2.25rem;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .contact-content p.subtitle {
            color: var(--text-muted);
            margin-bottom: 48px;
            font-size: 1.1rem;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-light);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: left;
            transition: transform 0.2s ease;
        }

        .info-item:hover {
            transform: scale(1.02);
        }

        .info-item i {
            width: 48px;
            height: 48px;
            background-color: var(--accent-light);
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .info-item-text h4 {
            color: var(--primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-item-text p {
            color: var(--text-dark);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Footer */
        footer {
            background-color: var(--primary-light);
            color: #94A3B8;
            padding: 40px 0;
            border-top: 1px solid #334155;
            text-align: center;
            font-size: 0.9rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                justify-content: center;
                gap: 12px;
                height: auto;
                padding: 16px 0;
            }

            .hero h1 {
                font-size: 2.25rem;
            }

            .hero-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

                    <li><a href="#yhteystiedot" class="btn btn-primary">
